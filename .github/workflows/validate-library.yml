name: Validate prompt library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the validator's own rules
        run: python3 scripts/test_validator.py

      - name: Validate metadata, links, maturity and status claims
        run: python3 scripts/validate_library.py

      - name: Verify the generated catalog is current
        run: |
          python3 scripts/validate_library.py --catalog
          if ! git diff --quiet -- _meta/CATALOG.md; then
            echo "::error::_meta/CATALOG.md is stale. Run: python3 scripts/validate_library.py --catalog"
            git diff --stat -- _meta/CATALOG.md
            exit 1
          fi

      - name: Verify the prompt gallery is current
        run: |
          if ! python3 scripts/generate_gallery.py --check; then
            echo "::error::GALLERY.md is stale. Run: python3 scripts/generate_gallery.py --write"
            exit 1
          fi

      - name: Self-test the duplicate detector
        run: python3 scripts/test_overlaps.py

      - name: Check for near-duplicate prompts (shingle signal)
        run: python3 scripts/find_overlaps.py --check --top 5

      - name: Check for near-duplicate prompts (structure x vocabulary signal)
        run: python3 scripts/find_overlaps.py --check --metric combined --top 5

      - name: Self-test the prose lint
        run: python3 scripts/test_prose_lint.py

      - name: Prose lint (ratchet — fails only on regression)
        run: python3 scripts/lint_prose.py --check

      - name: Self-test the task index
        run: python3 scripts/test_task_index.py

      - name: Verify the task index is current and every prompt has a home
        run: |
          if ! python3 scripts/generate_task_index.py --check; then
            echo "::error::TASKS.md is stale or a prompt is unrouted. Run: python3 scripts/generate_task_index.py --write"
            exit 1
          fi

      - name: Verify the evidence-level report is current
        run: |
          if ! python3 scripts/evidence_report.py --check; then
            echo "::error::_meta/evidence-levels.md is stale. Run: python3 scripts/evidence_report.py --write"
            exit 1
          fi
