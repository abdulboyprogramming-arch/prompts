name: Validate prompt library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate metadata, links, maturity and status claims
        run: python3 scripts/validate_library.py

      - name: Verify the generated catalog is current
        run: |
          python3 scripts/validate_library.py --catalog
          if ! git diff --quiet -- _meta/CATALOG.md; then
            echo "::error::_meta/CATALOG.md is stale. Run: python3 scripts/validate_library.py --catalog"
            git diff --stat -- _meta/CATALOG.md
            exit 1
          fi
